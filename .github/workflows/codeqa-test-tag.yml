name: Python codeqa/test/tag

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: Optional pytest selector to narrow the test run
        required: false
        default: ''

jobs:
  flake8:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Check code style with Flake8
      uses: TrueBrain/actions-flake8@v1.2
      with:
        path: src tests

  test:
    needs: [flake8]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["2.7", "3.5", "3.6", "3.8", "pypy-3.7"]
        exclude:
        - os: ubuntu-latest
          python-version: "3.6"
        - os: macos-latest
          python-version: "3.6"
        - os: macos-latest
          python-version: "pypy-3.7"
        - os: windows-latest
          python-version: "2.7"
        - os: windows-latest
          python-version: "3.5"
        - os: windows-latest
          python-version: "pypy-3.7"
        - os: macos-latest
          python-version: "2.7"
        - os: macos-latest
          python-version: "3.5"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: MatteoH2O1999/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache-build: true
        allow-build: allow
    - name: Upgrade setuptools
      run: pip install --index-url 'https://:2020-01-30@time-machines-pypi.sealsecurity.io/' "setuptools >= 40.9"
    - name: Install the project
      run: "pip install --index-url 'https://:2020-01-30@time-machines-pypi.sealsecurity.io/' --no-binary=:all: ."
    - name: Restore the release-era setuptools over the one the project install pulled in
      run: pip install --index-url 'https://:2020-01-30@time-machines-pypi.sealsecurity.io/' --force-reinstall "setuptools >= 40.9"
    - name: Install atomicwrites from public PyPI (absent from the release-era mirror)
      if: matrix.python-version == '2.7'
      run: pip install --index-url 'https://pypi.org/simple' "atomicwrites==1.3.0"
    - name: Lend pip a macOS-11-aware wheel to build the test deps with
      if: runner.os == 'macOS'
      run: pip install --index-url 'https://pypi.org/simple' "wheel==0.45.1"
    - name: Install test dependencies
      run: pip install --index-url 'https://:2020-01-30@time-machines-pypi.sealsecurity.io/' .[test]
    - name: Put the project's own wheel and the release-era setuptools back
      if: runner.os == 'macOS'
      run: |
        pip install --index-url 'https://:2020-01-30@time-machines-pypi.sealsecurity.io/' --force-reinstall --no-deps --no-binary=:all: .
        pip install --index-url 'https://:2020-01-30@time-machines-pypi.sealsecurity.io/' --force-reinstall "setuptools >= 40.9"
    - name: Test with pytest
      if: runner.os != 'macOS'
      run: pytest ${{ inputs.test-filter }}
    - name: Test with pytest, minus the five tests that build C-extension wheels
      # wheel 0.34.2 predates macOS 11: pep425tags.calculate_macosx_platform_tag
      # asserts a two-component release, so every test that builds a platform
      # wheel dies on an 11+ runner. tests/test_wheelfile.py is unaffected.
      if: runner.os == 'macOS'
      run: pytest ${{ inputs.test-filter }} --deselect tests/test_bdist_wheel.py::test_limited_abi --deselect tests/test_bdist_wheel.py::test_no_scripts --deselect tests/test_bdist_wheel.py::test_unicode_record --deselect tests/cli/test_convert.py::test_convert_egg --deselect tests/cli/test_unpack.py::test_unpack

  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: false
    steps:
    - uses: actions/checkout@v4
    - uses: agronholm/action-general-autotag@regexnofail
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        source_file: docs/news.rst
        extraction_regex: "\\*\\*(\\d+\\.\\d+\\.\\d+(?:(?:a|b|rc)\\d+)?) "
